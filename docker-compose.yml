# Local stack: PostgreSQL + LocalStack (S3 emulator) + the service.
# The AWS keys below are LocalStack's documented dummy values, not real credentials.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ingestion
      POSTGRES_USER: ingestion
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "5432:5432"

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: s3
    ports:
      - "4566:4566"

  ingestion:
    build: .
    depends_on:
      - postgres
      - localstack
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ingestion
      DB_USERNAME: ingestion
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      S3_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
